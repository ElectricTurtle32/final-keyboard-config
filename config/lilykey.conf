# ZMK Configuration

# Keyboard Features
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# ZMK Studio Configuration
CONFIG_ZMK_STUDIO_RPC_TRANSPORT_BLE=y
CONFIG_ZMK_STUDIO_RPC_TRANSPORT_USB=y

# USB Configuration for Studio
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_USB_HID=y

# Display & Logging
CONFIG_ZMK_DISPLAY=n

